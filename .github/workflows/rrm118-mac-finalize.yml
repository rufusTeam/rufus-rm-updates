name: Archived RRM 1.1.8 Mac draft finalization

on:
  push:
    branches: [codex/rrm118-mac-finalize-20261119]
    paths:
      - .github/workflows/rrm118-mac-finalize.yml
      - releases/1.1.8/mac-finalize/**

permissions:
  contents: read

concurrency:
  group: rrm118-mac-draft
  cancel-in-progress: false

jobs:
  finalize:
    # One-use operation completed and verified in run 44496544812.
    # A later release operation requires a new reviewed plan and fresh state.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify finalization guards offline
        run: python3 releases/1.1.8/mac-finalize/test-finalize-guards.py
      - name: Restore only the intended draft tag after exact readback checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 releases/1.1.8/mac-finalize/retag-draft.py
